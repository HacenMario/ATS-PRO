<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Advanced Tasks Supervisor — original logo: industrial clipboard + gear + check -->
  <defs>
    <linearGradient id="atsBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#26c0ac"/>
      <stop offset="1" stop-color="#0b6a61"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#atsBg)"/>
  <!-- clipboard -->
  <rect x="17" y="14" width="30" height="38" rx="5" fill="#ffffff" opacity="0.96"/>
  <rect x="26" y="10" width="12" height="8" rx="3" fill="#0d4643"/>
  <!-- checklist lines -->
  <rect x="23" y="27" width="18" height="3" rx="1.5" fill="#16323d" opacity="0.35"/>
  <rect x="23" y="34" width="18" height="3" rx="1.5" fill="#16323d" opacity="0.35"/>
  <rect x="23" y="41" width="12" height="3" rx="1.5" fill="#16323d" opacity="0.35"/>
  <!-- check badge -->
  <circle cx="42" cy="43" r="11" fill="#f59e0b"/>
  <path d="M36.8 43.2l3.6 3.6 7-7" fill="none" stroke="#0d4643" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
